name: Add Umami feature events

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-umami-feature-events.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add anonymous feature event attributes
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          p = Path("100-verbs/index.html")
          bootstrap = p.read_text(encoding="utf-8")
          m = re.search(r'const b="([^"]+)"', bootstrap)
          if not m:
              raise SystemExit("Embedded app payload not found")

          html = gzip.decompress(base64.b64decode(m.group(1))).decode("utf-8")

          replacements = [
              (
                  '<button class="primary" data-go="study">Start flashcards</button>',
                  '<button class="primary" data-go="study" data-umami-event="start-flashcards" data-umami-event-location="hero">Start flashcards</button>'
              ),
              (
                  '<button class="secondary" data-go="quiz">Take a 10-verb quiz</button>',
                  '<button class="secondary" data-go="quiz" data-umami-event="open-quiz" data-umami-event-location="hero">Take a 10-verb quiz</button>'
              ),
              (
                  '<button class="primary" id="startQuiz">Start quiz</button>',
                  '<button class="primary" id="startQuiz" data-umami-event="start-quiz">Start quiz</button>'
              ),
              (
                  '<button class="secondary small" id="songBtn">▶ Hear it in the song</button>',
                  '<button class="secondary small" id="songBtn" data-umami-event="hear-in-song">▶ Hear it in the song</button>'
              ),
              (
                  '<button class="tab" data-tab="all">All 100</button>',
                  '<button class="tab" data-tab="all" data-umami-event="open-all-verbs">All 100</button>'
              ),
              (
                  '<button class="tab" data-tab="plan">7-day plan</button>',
                  '<button class="tab" data-tab="plan" data-umami-event="open-7-day-plan">7-day plan</button>'
              ),
              (
                  'No account. No tracking. Your study progress stays in this browser.',
                  'No account. Your study progress stays in this browser. Anonymous, cookieless feature analytics help us improve the learning experience.'
              )
          ]

          changed = 0
          for old, new in replacements:
              if old in html:
                  html = html.replace(old, new)
                  changed += 1

          if changed < 6:
              raise SystemExit(f"Only patched {changed} expected feature hooks")

          payload = base64.b64encode(gzip.compress(html.encode("utf-8"), compresslevel=9)).decode("ascii")
          rebuilt = re.sub(r'const b="[^"]+"', 'const b="' + payload + '"', bootstrap, count=1)
          p.write_text(rebuilt, encoding="utf-8")
          print(f"Patched {changed} feature analytics hooks")
          PY

      - name: Commit feature analytics hooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 100-verbs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add anonymous Umami feature event hooks"
          git push
